name: images

# Publish every Linux desktop sandbox image to ghcr.
#
# These are CONTAINERS, not VMs: each flavour is a Debian image with an X11 or
# Wayland display stack, and the daemon is baked in as the entrypoint. There is
# no guest disk anywhere in this repository - that is easysandbox-vm's problem.
#
# TWO STAGES, on purpose:
#
#   base    debian + apt desktop + entrypoint   -> sandbox-base-<flavour>
#   worker  FROM base + easyworker + easystream -> sandbox-<flavour>
#
# The halves move at different speeds. A desktop changes when a package or the
# entrypoint does; the two binaries come from their own releases, many times a
# day. Publishing them separately means a daemon bump republishes one cheap
# layer instead of re-running apt for seven desktops.
#
# Both stages are released, and both are tagged with the git tag and `latest`.
# A consumer that wants "the desktop we trust, with today's easyworker" pulls
# sandbox-base-<flavour> and applies Containerfile.worker itself - that is the
# same thing this workflow does in its worker job.

on:
  # TAGS ONLY. `branches` and `tags` are mutually exclusive as triggers:
  # defining `branches` suppresses tag events entirely, so a workflow that wants
  # both has to be two files. This one cuts releases; ci.yml builds on main/PRs.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WORKER_REPO: easydev-org/easyworker
  EASYSTREAM_REPO: easydev-org/easystream

jobs:
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # X11: the desktops with no Wayland session of their own.
          - { flavour: openbox,  image: sandbox-x11,      base: x11 }
          - { flavour: i3,       image: sandbox-i3,       base: i3 }
          - { flavour: cinnamon, image: sandbox-cinnamon, base: cinnamon }
          - { flavour: xfce4,    image: sandbox-xfce,     base: xfce }
          # Wayland: wlroots.
          - { flavour: labwc,    image: sandbox-wayland,  base: wayland }
          - { flavour: sway,     image: sandbox-sway,     base: sway }
          - { flavour: cage,     image: sandbox-cage,     base: cage }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The flavour's Containerfile becomes Dockerfile and the shared entrypoint
      # lands beside it. No guest binaries: those are stage 2.
      - name: stage the base context
        run: |
          set -euo pipefail
          FDIR="${{ matrix.flavour }}"
          WORK="$(mktemp -d)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cp "$FDIR/Containerfile" "$WORK/Dockerfile"
          if [ -f "$FDIR/entrypoint.sh" ]; then ENTRY="$FDIR/entrypoint.sh"
          else ENTRY="common/entrypoint.sh"; fi
          cp "$ENTRY" "$WORK/entrypoint.sh"
          # ARG ENTRY_HASH busts the COPY layer when the script changes.
          echo "ENTRY_HASH=$(sha256sum "$ENTRY" | cut -c1-16)" >> "$GITHUB_ENV"
          for f in "$FDIR"/*; do
            case "$(basename "$f")" in
              Containerfile|entrypoint.sh) ;;
              *) cp "$f" "$WORK/" 2>/dev/null || true ;;
            esac
          done
          ls -l "$WORK"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORK }}
          file: ${{ env.WORK }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/easydev-org/sandbox-base-${{ matrix.base }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/easydev-org/sandbox-base-${{ matrix.base }}:latest
          build-args: |
            ENTRY_HASH=${{ env.ENTRY_HASH }}

  worker:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavour: openbox,  image: sandbox-x11,      base: x11 }
          - { flavour: i3,       image: sandbox-i3,       base: i3 }
          - { flavour: cinnamon, image: sandbox-cinnamon, base: cinnamon }
          - { flavour: xfce4,    image: sandbox-xfce,     base: xfce }
          - { flavour: labwc,    image: sandbox-wayland,  base: wayland }
          - { flavour: sway,     image: sandbox-sway,     base: sway }
          - { flavour: cage,     image: sandbox-cage,     base: cage }
    steps:
      - uses: actions/checkout@v4

      - name: resolve release versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          w=$(gh release view --repo "$WORKER_REPO" --json tagName -q .tagName)
          e=$(gh release view --repo "$EASYSTREAM_REPO" --json tagName -q .tagName)
          echo "worker=$w easystream=$e"
          echo "worker=$w" >> "$GITHUB_OUTPUT"
          echo "easystream=$e" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: stage the worker context
        env:
          WORKER_VERSION: ${{ steps.ver.outputs.worker }}
          EASYSTREAM_VERSION: ${{ steps.ver.outputs.easystream }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cp Containerfile.worker "$WORK/Dockerfile"
          GH=https://github.com
          curl -fsSL -o "$WORK/easyworker" \
            "$GH/$WORKER_REPO/releases/download/$WORKER_VERSION/easyworker-linux-amd64"
          curl -fsSL -o "$WORK/easystream" \
            "$GH/$EASYSTREAM_REPO/releases/download/$EASYSTREAM_VERSION/easystream-linux-amd64"
          chmod 755 "$WORK/easyworker" "$WORK/easystream"
          # Bust the COPY layers on content: their only build arguments are the
          # file names, so without this a new release was silently ignored and
          # the image kept shipping the daemon from the first build.
          echo "BIN_HASH=$(cat "$WORK/easyworker" "$WORK/easystream" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
          ls -l "$WORK"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORK }}
          file: ${{ env.WORK }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/easydev-org/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/easydev-org/${{ matrix.image }}:latest
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/easydev-org/sandbox-base-${{ matrix.base }}:${{ github.ref_name }}
            BIN_HASH=${{ env.BIN_HASH }}

  # The image is only useful if it starts, paints and answers. An image that
  # builds but shows a black rectangle, or whose a11y API is dead, fails at the
  # point of use - in a cluster, in front of a user.
  smoke:
    needs: [base, worker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavour: openbox,  image: sandbox-x11 }
          - { flavour: i3,       image: sandbox-i3 }
          - { flavour: cinnamon, image: sandbox-cinnamon }
          - { flavour: xfce4,    image: sandbox-xfce }
          - { flavour: labwc,    image: sandbox-wayland }
          - { flavour: sway,     image: sandbox-sway }
          - { flavour: cage,     image: sandbox-cage }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: run the published image
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/easydev-org/${{ matrix.image }}:${{ github.ref_name }}"
          docker run -d --name sb --shm-size=1g -p 48078:48078 -p 48080:48080 "$IMG"
          # No fixed settle; the next step polls /health until the daemon answers.
          sleep 1
          docker ps -a
          docker logs sb 2>&1 | tail -40

      - name: daemon is up
        run: |
          set -euo pipefail
          # /health and /capabilities never touch the a11y backend: one is a
          # constant, the other is a value probe.rs decided once at startup. They
          # must answer even when the desktop is the problem, so they run first.
          API="http://127.0.0.1:48078"

          # Poll for the listener rather than sleeping a fixed time. The
          # entrypoint starts Xvfb, the session bus, the system bus step, at-spi2,
          # easyworker and the desktop composer BEFORE easystream, so at 5s the
          # port is simply not open yet - and a closed port comes back as
          # 'Connection reset by peer', which reads like a crash and means 'too
          # early'.
          up=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 "$API/health" -o /tmp/h 2>/dev/null; then
              echo "daemon listening after ${i}s: $(cat /tmp/h)"
              up=1
              break
            fi
            sleep 1
          done
          [ "$up" = 1 ] || {
            echo "daemon never listened on 48078" >&2
            docker logs sb 2>&1 | tail -40
            exit 1
          }

          echo "--- /capabilities ---"
          curl -fsS --max-time 10 "$API/capabilities" | tee /tmp/caps; echo
          # capabilities must name a session; without one the daemon has no
          # display and nothing further can work.
          grep -qiE '"(Session|session)"' /tmp/caps \
            || { echo "capabilities names no session" >&2; cat /tmp/caps; exit 1; }

      - name: wait for the session
        run: |
          set -euo pipefail
          # Poll /a11y/apps until it names something, instead of sleeping a fixed
          # 25 seconds. cinnamon and xfce4 take far longer to register with the
          # accessibility bus than openbox does, and a fixed wait is either too
          # short for them or wasted time for the rest.
          #
          # This is not just politeness. easystream's a11y_route does
          #
          #   if guard.is_none() { *guard = Some(Backend::open()?); }
          #
          # so when the backend cannot open, the `?` propagates out of the handler
          # and the connection is closed with NO http response at all - curl exits
          # 56 ('failure receiving data'). An unreachable a11y bus therefore looks
          # like a broken network call rather than a desktop still starting.
          API="http://127.0.0.1:48078"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "$API/a11y/apps" -o /tmp/apps 2>/dev/null && [ -s /tmp/apps ]; then
              echo "a11y bus ready after ${i}0% of the budget"
              cat /tmp/apps
              exit 0
            fi
            sleep 2
          done
          echo "a11y bus never produced an app list" >&2
          docker logs sb 2>&1 | tail -40
          exit 1

      - name: screenshot and inspect
        run: |
          set -euo pipefail
          # /a11y/screenshot, from the HOST against the mapped port.
          #
          # The endpoint answers PNG bytes - there is no ?out=, and no one-shot
          # CLI either: main() replies 'usage: easystream [serve]' to anything
          # that is not serve. Not docker exec either, because the image has no
          # curl inside and a file written in the container is not a file here.
          curl -fsS --max-time 30 "http://127.0.0.1:48078/a11y/screenshot" -o screen.png
          ls -l screen.png
          python3 - <<'PY'
          import sys, zlib, struct

          raw = open('screen.png','rb').read()
          if not raw.startswith(b'\x89PNG'):
              sys.exit("not a PNG: the daemon answered something else")

          # Minimal PNG decode: walk the chunks, undo the scanline filters, count
          # distinct RGB values. Enough to tell a desktop from a blank screen, and
          # it needs no pillow on the runner.
          pos, w, h, depth, ctype, idat = 8, 0, 0, 0, 0, b''
          while pos < len(raw):
              ln = struct.unpack('>I', raw[pos:pos+4])[0]
              typ = raw[pos+4:pos+8]
              body = raw[pos+8:pos+8+ln]
              if typ == b'IHDR':
                  w, h, depth, ctype = struct.unpack('>IIBB', body[:10])
              elif typ == b'IDAT':
                  idat += body
              elif typ == b'IEND':
                  break
              pos += 12 + ln

          if depth != 8 or ctype not in (2, 6):
              sys.exit(f"unsupported PNG: depth={depth} colour type={ctype}")
          chan = 3 if ctype == 2 else 4
          data = zlib.decompress(idat)
          stride = w * chan
          prev = bytearray(stride)
          seen = {}
          off = 0
          for _ in range(h):
              ft = data[off]; off += 1
              line = bytearray(data[off:off+stride]); off += stride
              if ft == 1:
                  for i in range(chan, stride):
                      line[i] = (line[i] + line[i-chan]) & 0xFF
              elif ft == 2:
                  for i in range(stride):
                      line[i] = (line[i] + prev[i]) & 0xFF
              elif ft == 3:
                  for i in range(stride):
                      a = line[i-chan] if i >= chan else 0
                      line[i] = (line[i] + ((a + prev[i]) >> 1)) & 0xFF
              elif ft == 4:
                  for i in range(stride):
                      a = line[i-chan] if i >= chan else 0
                      b = prev[i]
                      c = prev[i-chan] if i >= chan else 0
                      p = a + b - c
                      pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[i] = (line[i] + pr) & 0xFF
              for x in range(0, stride, chan * 17):
                  c = bytes(line[x:x+3])
                  seen[c] = seen.get(c, 0) + 1
              prev = line

          total = sum(seen.values())
          distinct = len(seen)
          dominant = max(seen.values()) * 100.0 / total
          print(f"{w}x{h} distinct={distinct} dominant={dominant:.1f}%")
          # A screen that drew nothing is one colour at 100%. A compositor with
          # no wallpaper is nearly uniform but still has many colours - the count
          # is the signal, not the share.
          if distinct < 8:
              sys.exit(f"BLANK: only {distinct} colours")
          if dominant > 99.5:
              sys.exit(f"BLANK: {dominant:.1f}% one colour")
          print("PICTURE OK")
          PY

      - name: easystream API
        run: |
          set -euo pipefail
          # The daemon's real surface, read off src/http.rs: /health and
          # /capabilities at the top, everything else under /a11y/.
          API="http://127.0.0.1:48078"
          for endpoint in health capabilities a11y/apps a11y/tree; do
            printf '%-14s ' "$endpoint"
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 20 "$API/$endpoint" || echo 000)
            echo "HTTP $code  bytes=$(wc -c < /tmp/out)"
            [ "$code" = 200 ] || { echo "FAILED $endpoint"; exit 1; }
          done
          # /a11y/apps has to name something: an empty answer means the daemon is
          # up but the accessibility bus is not, which is what a broken AT-SPI
          # setup looks like from the outside.
          curl -fsS --max-time 20 "$API/a11y/apps" | tee /tmp/apps
          [ -s /tmp/apps ] || { echo "no apps: a11y bus not reachable"; exit 1; }

      - name: easystream input and clipboard
        run: |
          set -euo pipefail
          API="http://127.0.0.1:48078"
          curl -fsS --max-time 20 -X POST "$API/a11y/click?x=100&y=100"
          curl -fsS --max-time 20 -X POST --data 'echo smoke' "$API/a11y/type"
          curl -fsS --max-time 20 -X POST "$API/a11y/key?name=Return"
          # Clipboard has to round-trip: set then get. Reading back what was
          # written is the only way to know both directions work.
          curl -fsS --max-time 20 "$API/a11y/clipboard?set=smoke-roundtrip"
          got=$(curl -fsS --max-time 20 "$API/a11y/clipboard?get")
          echo "clipboard: $got"
          echo "$got" | grep -q smoke-roundtrip || { echo "clipboard round-trip failed"; exit 1; }

      - name: easyworker API
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/w -w '%{http_code}' --max-time 20 http://127.0.0.1:48080/ || echo 000)
          echo "worker HTTP $code  bytes=$(wc -c < /tmp/w)"
          [ "$code" != 000 ] || { echo "easyworker not listening on 48080"; exit 1; }

      - name: artifacts and cleanup
        if: always()
        run: |
          docker cp sb:/tmp/s.ppm screen.ppm 2>/dev/null || true
          docker logs sb > containers.log 2>&1 || true
          docker rm -f sb || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.image }}
          path: |
            screen.ppm
            containers.log
          if-no-files-found: warn
          retention-days: 14
