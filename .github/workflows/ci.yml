name: ci

# Two stages, then the two things that decide whether an image is usable:
# a screenshot of the desktop, and the easystream/easyworker HTTP API.
#
#   base    debian + apt desktop + entrypoint           (7 flavours, minutes)
#   worker  FROM base + easyworker + easystream          (7 flavours, seconds)
#   smoke   run it, screenshot it, drive it over HTTP    (7 flavours)
#
# Nothing is published under a name anyone depends on: the tag is per run, and
# this workflow exists to exercise the build and the runtime, not to release.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WORKER_REPO: easydev-org/easyworker
  EASYSTREAM_REPO: easydev-org/easystream

jobs:
  # ---------------------------------------------------------------------------
  # stage 1: the desktop. Expensive, and it only moves when a package or the
  # entrypoint does - which is why it is a separate job with its own cache.
  # ---------------------------------------------------------------------------
  base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # X11: the desktops with no Wayland session of their own.
          - { flavour: openbox,  image: sandbox-x11,      base: x11 }
          - { flavour: i3,       image: sandbox-i3,       base: i3 }
          - { flavour: cinnamon, image: sandbox-cinnamon, base: cinnamon }
          - { flavour: xfce4,    image: sandbox-xfce,     base: xfce }
          # Wayland: wlroots.
          - { flavour: labwc,    image: sandbox-wayland,  base: wayland }
          - { flavour: sway,     image: sandbox-sway,     base: sway }
          - { flavour: cage,     image: sandbox-cage,     base: cage }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: decide the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The flavour's Containerfile becomes Dockerfile, and the entrypoint is
      # copied beside it. That is the whole base context - no guest binaries.
      - name: stage the base context
        run: |
          set -euo pipefail
          FDIR="${{ matrix.flavour }}"
          WORK="$(mktemp -d)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cp "$FDIR/Containerfile" "$WORK/Dockerfile"
          if [ -f "$FDIR/entrypoint.sh" ]; then ENTRY="$FDIR/entrypoint.sh"
          else ENTRY="common/entrypoint.sh"; fi
          cp "$ENTRY" "$WORK/entrypoint.sh"
          echo "ENTRY_HASH=$(sha256sum "$ENTRY" | cut -c1-16)" >> "$GITHUB_ENV"
          for f in "$FDIR"/*; do
            case "$(basename "$f")" in
              Containerfile|entrypoint.sh) ;;
              *) cp "$f" "$WORK/" 2>/dev/null || true ;;
            esac
          done

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORK }}
          file: ${{ env.WORK }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/easydev-org/sandbox-base-${{ matrix.base }}:${{ steps.tag.outputs.tag }}
          build-args: |
            ENTRY_HASH=${{ env.ENTRY_HASH }}

  # ---------------------------------------------------------------------------
  # stage 2: the guest binaries on top of each base. Cheap on purpose - this is
  # the job that runs when only easyworker or easystream has a new release.
  # ---------------------------------------------------------------------------
  worker:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavour: openbox,  image: sandbox-x11,      base: x11 }
          - { flavour: i3,       image: sandbox-i3,       base: i3 }
          - { flavour: cinnamon, image: sandbox-cinnamon, base: cinnamon }
          - { flavour: xfce4,    image: sandbox-xfce,     base: xfce }
          - { flavour: labwc,    image: sandbox-wayland,  base: wayland }
          - { flavour: sway,     image: sandbox-sway,     base: sway }
          - { flavour: cage,     image: sandbox-cage,     base: cage }
    steps:
      - uses: actions/checkout@v4

      - name: resolve release versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          w=$(gh release view --repo "$WORKER_REPO" --json tagName -q .tagName)
          e=$(gh release view --repo "$EASYSTREAM_REPO" --json tagName -q .tagName)
          echo "worker=$w" >> "$GITHUB_OUTPUT"
          echo "easystream=$e" >> "$GITHUB_OUTPUT"
          echo "worker=$w easystream=$e"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: stage the worker context
        env:
          WORKER_VERSION: ${{ steps.ver.outputs.worker }}
          EASYSTREAM_VERSION: ${{ steps.ver.outputs.easystream }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cp Containerfile.worker "$WORK/Dockerfile"
          GH=https://github.com
          curl -fsSL -o "$WORK/easyworker" \
            "$GH/$WORKER_REPO/releases/download/$WORKER_VERSION/easyworker-linux-amd64"
          curl -fsSL -o "$WORK/easystream" \
            "$GH/$EASYSTREAM_REPO/releases/download/$EASYSTREAM_VERSION/easystream-linux-amd64"
          chmod 755 "$WORK/easyworker" "$WORK/easystream"
          # Bust the COPY layers on content, not on the file names.
          echo "BIN_HASH=$(cat "$WORK/easyworker" "$WORK/easystream" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
          ls -l "$WORK"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORK }}
          file: ${{ env.WORK }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/easydev-org/${{ matrix.image }}:${{ needs.base.outputs.tag }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/easydev-org/sandbox-base-${{ matrix.base }}:${{ needs.base.outputs.tag }}
            BIN_HASH=${{ env.BIN_HASH }}

  # ---------------------------------------------------------------------------
  # smoke: start the image, prove the desktop paints, and prove the daemon
  # answers. An image that builds and pushes but shows a black rectangle, or
  # whose /a11y API is dead, is worse than no image - it fails at the point of
  # use, in a cluster, in front of a user.
  # ---------------------------------------------------------------------------
  smoke:
    needs: [base, worker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavour: openbox,  image: sandbox-x11,     expect: desktop }
          - { flavour: i3,       image: sandbox-i3,      expect: desktop }
          - { flavour: cinnamon, image: sandbox-cinnamon, expect: desktop }
          - { flavour: xfce4,    image: sandbox-xfce,    expect: desktop }
          - { flavour: labwc,    image: sandbox-wayland, expect: desktop }
          - { flavour: sway,     image: sandbox-sway,    expect: desktop }
          - { flavour: cage,     image: sandbox-cage,    expect: desktop }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: run the image
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/easydev-org/${{ matrix.image }}:${{ needs.base.outputs.tag }}"
          docker run -d --name sb \
            --shm-size=1g \
            -p 48079:48079 -p 48080:48080 \
            "$IMG"
          # A short settle, not a full wait: the next step polls the daemon until
          # the accessibility bus has something in it, which is the real readiness
          # signal and costs nothing for the fast desktops.
          sleep 5
          docker ps -a
          docker logs sb 2>&1 | tail -40

      - name: wait for the session
        run: |
          set -euo pipefail
          # Poll /a11y/apps until it names something, instead of sleeping a fixed
          # 25 seconds. cinnamon and xfce4 take far longer to register with the
          # accessibility bus than openbox does, and a fixed wait is either too
          # short for them or wasted time for the rest.
          #
          # This is not just politeness. easystream's a11y_route does
          #
          #   if guard.is_none() { *guard = Some(Backend::open()?); }
          #
          # so when the backend cannot open, the `?` propagates out of the handler
          # and the connection is closed with NO http response at all - curl exits
          # 56 ('failure receiving data'). An unreachable a11y bus therefore looks
          # like a broken network call rather than a desktop still starting.
          API="http://127.0.0.1:48079"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "$API/a11y/apps" -o /tmp/apps 2>/dev/null && [ -s /tmp/apps ]; then
              echo "a11y bus ready after ${i}0% of the budget"
              cat /tmp/apps
              exit 0
            fi
            sleep 2
          done
          echo "a11y bus never produced an app list" >&2
          docker logs sb 2>&1 | tail -40
          exit 1

      - name: screenshot and inspect
        run: |
          set -euo pipefail
          # /a11y/screenshot, from the HOST against the mapped port.
          #
          # The endpoint answers PNG bytes - there is no ?out=, and no one-shot
          # CLI either: main() replies 'usage: easystream [serve]' to anything
          # that is not serve. Not docker exec either, because the image has no
          # curl inside and a file written in the container is not a file here.
          curl -fsS --max-time 30 "http://127.0.0.1:48079/a11y/screenshot" -o screen.png
          ls -l screen.png
          python3 - <<'PY'
          import sys, zlib, struct

          raw = open('screen.png','rb').read()
          if not raw.startswith(b'\x89PNG'):
              sys.exit("not a PNG: the daemon answered something else")

          # Minimal PNG decode: walk the chunks, undo the scanline filters, count
          # distinct RGB values. Enough to tell a desktop from a blank screen, and
          # it needs no pillow on the runner.
          pos, w, h, depth, ctype, idat = 8, 0, 0, 0, 0, b''
          while pos < len(raw):
              ln = struct.unpack('>I', raw[pos:pos+4])[0]
              typ = raw[pos+4:pos+8]
              body = raw[pos+8:pos+8+ln]
              if typ == b'IHDR':
                  w, h, depth, ctype = struct.unpack('>IIBB', body[:10])
              elif typ == b'IDAT':
                  idat += body
              elif typ == b'IEND':
                  break
              pos += 12 + ln

          if depth != 8 or ctype not in (2, 6):
              sys.exit(f"unsupported PNG: depth={depth} colour type={ctype}")
          chan = 3 if ctype == 2 else 4
          data = zlib.decompress(idat)
          stride = w * chan
          prev = bytearray(stride)
          seen = {}
          off = 0
          for _ in range(h):
              ft = data[off]; off += 1
              line = bytearray(data[off:off+stride]); off += stride
              if ft == 1:
                  for i in range(chan, stride):
                      line[i] = (line[i] + line[i-chan]) & 0xFF
              elif ft == 2:
                  for i in range(stride):
                      line[i] = (line[i] + prev[i]) & 0xFF
              elif ft == 3:
                  for i in range(stride):
                      a = line[i-chan] if i >= chan else 0
                      line[i] = (line[i] + ((a + prev[i]) >> 1)) & 0xFF
              elif ft == 4:
                  for i in range(stride):
                      a = line[i-chan] if i >= chan else 0
                      b = prev[i]
                      c = prev[i-chan] if i >= chan else 0
                      p = a + b - c
                      pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[i] = (line[i] + pr) & 0xFF
              for x in range(0, stride, chan * 17):
                  c = bytes(line[x:x+3])
                  seen[c] = seen.get(c, 0) + 1
              prev = line

          total = sum(seen.values())
          distinct = len(seen)
          dominant = max(seen.values()) * 100.0 / total
          print(f"{w}x{h} distinct={distinct} dominant={dominant:.1f}%")
          # A screen that drew nothing is one colour at 100%. A compositor with
          # no wallpaper is nearly uniform but still has many colours - the count
          # is the signal, not the share.
          if distinct < 8:
              sys.exit(f"BLANK: only {distinct} colours")
          if dominant > 99.5:
              sys.exit(f"BLANK: {dominant:.1f}% one colour")
          print("PICTURE OK")
          PY

      - name: easystream API
        run: |
          set -euo pipefail
          # The daemon's real surface, read off src/http.rs: /health and
          # /capabilities at the top, everything else under /a11y/.
          API="http://127.0.0.1:48079"
          for endpoint in health capabilities a11y/apps a11y/tree; do
            printf '%-14s ' "$endpoint"
            code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 20 "$API/$endpoint" || echo 000)
            echo "HTTP $code  bytes=$(wc -c < /tmp/out)"
            [ "$code" = 200 ] || { echo "FAILED $endpoint"; exit 1; }
          done
          # /a11y/apps has to name something: an empty answer means the daemon is
          # up but the accessibility bus is not, which is what a broken AT-SPI
          # setup looks like from the outside.
          curl -fsS --max-time 20 "$API/a11y/apps" | tee /tmp/apps
          [ -s /tmp/apps ] || { echo "no apps: a11y bus not reachable"; exit 1; }

      - name: easystream input and clipboard
        run: |
          set -euo pipefail
          API="http://127.0.0.1:48079"
          curl -fsS --max-time 20 -X POST "$API/a11y/click?x=100&y=100"
          curl -fsS --max-time 20 -X POST --data 'echo smoke' "$API/a11y/type"
          curl -fsS --max-time 20 -X POST "$API/a11y/key?name=Return"
          # Clipboard has to round-trip: set then get. Reading back what was
          # written is the only way to know both directions work.
          curl -fsS --max-time 20 "$API/a11y/clipboard?set=smoke-roundtrip"
          got=$(curl -fsS --max-time 20 "$API/a11y/clipboard?get")
          echo "clipboard: $got"
          echo "$got" | grep -q smoke-roundtrip || { echo "clipboard round-trip failed"; exit 1; }

      - name: easyworker API
        run: |
          set -euo pipefail
          # easyworker owns the container's lifetime and listens on WORKER_PORT.
          code=$(curl -s -o /tmp/w -w '%{http_code}' --max-time 20 http://127.0.0.1:48080/ || echo 000)
          echo "worker HTTP $code  bytes=$(wc -c < /tmp/w)"
          [ "$code" != 000 ] || { echo "easyworker is not listening on 48080"; exit 1; }

      - name: screenshot artifact and cleanup
        if: always()
        run: |
          docker logs sb > containers.log 2>&1 || true
          docker rm -f sb || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.image }}
          path: |
            screen.png
            containers.log
          if-no-files-found: warn
          retention-days: 14
