# Deploy the kiosk sandbox: a locked-down full-screen chromium behind cage,
# driven only through the easystream daemon (est:// video+input, /a11y HTTP).
#
#   kubectl apply -f deploy/kiosk.yaml
#
# The Service `kiosk-web` (port 80 -> 48078) is meant to sit behind a TLS
# gateway: WebCodecs (the H.264 decoder the web UI uses) requires a SECURE
# CONTEXT, so the page must be served over https (or localhost) — a plain
# http:// URL in the cluster will show "no WebCodecs (need HTTPS)".
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kiosk-home}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: workspace-local
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kiosk-opt}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: workspace-local
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kiosk-data}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: workspace-local
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiosk
  labels: {app: kiosk}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kiosk}
  template:
    metadata:
      labels: {app: kiosk}
    spec:
      containers:
        - name: kiosk
          image: artifact.worker.svc.cluster.local/sandbox/sandbox-kiosk:debian-trixie
          env:
            # The one page the kiosk shows.
            - {name: KIOSK_URL, value: "https://www.google.com"}
            - {name: SCREEN_GEOMETRY, value: "1024x768"}
            - {name: EAZYSTREAM_PORT, value: "48079"}
            - {name: EAZYSTREAM_HTTP_PORT, value: "48078"}
            # View (read-only) is the OPEN default — no token needed. CONTROL
            # (input + a11y actions + clipboard writes) needs this token.
            - {name: EAZYSTREAM_CONTROL_TOKEN, value: "change-me" }
            - {name: XDG_RUNTIME_DIR, value: "/tmp/xdg"}
          ports:
            - {containerPort: 48078, name: http}
            - {containerPort: 48079, name: est}
          resources:
            limits: {cpu: "4", memory: "16Gi", squat.ai/uinput: "1"}
            requests: {cpu: "4", memory: "16Gi"}
          securityContext:
            # The image also strips every shell/interpreter/pkg-manager, so a
            # read-only rootfs + no-new-privs leaves no way to run anything but
            # the kiosk stack.
            appArmorProfile: {type: Unconfined}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {mountPath: /root, name: pvc-0}
            - {mountPath: /opt, name: pvc-1}
            - {mountPath: /data, name: pvc-2}
            - {mountPath: /tmp, name: tmp}
            - {mountPath: /run, name: run}
            - {mountPath: /var/log, name: varlog}
      volumes:
        - {name: pvc-0, persistentVolumeClaim: {claimName: kiosk-home}}
        - {name: pvc-1, persistentVolumeClaim: {claimName: kiosk-opt}}
        - {name: pvc-2, persistentVolumeClaim: {claimName: kiosk-data}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
        - {name: run, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
        - {name: varlog, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kiosk}
spec:
  type: ClusterIP
  selector: {app: kiosk}
  ports:
    - {name: http, port: 48078, targetPort: 48078}
    - {name: est, port: 48079, targetPort: 48079}
---
apiVersion: v1
kind: Service
metadata: {name: kiosk-web}
spec:
  type: ClusterIP
  selector: {app: kiosk}
  ports:
    - {name: tcp-80, port: 80, targetPort: 48078}
